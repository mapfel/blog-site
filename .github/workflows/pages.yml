name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      PAGEFIND_VERSION: 1.5.2
      TZ: Europe/Berlin
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout content submodule
        run: |
          git config submodule.content-source.url "https://x-access-token:${{ secrets.BLOG_CONTENT_PAT }}@github.com/mapfel/blog-content.git"
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate content
        run: python content-source/scripts/validate_content.py content-source/content/posts

      - name: Install Hugo
        shell: bash
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf \
            "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build production site
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            hugo --gc --minify --cacheDir "${{ runner.temp }}/hugo-cache"
          else
            hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" \
              --cacheDir "${{ runner.temp }}/hugo-cache"
          fi

      - name: Build search index
        shell: bash
        run: |
          pip install "pagefind[bin]==${PAGEFIND_VERSION}"
          python -m pagefind --site public

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
